# 최종 앱(포트홀 알리미) APK 자동 빌드: 소스코드 폴더가 바뀌면 브랜치 상관없이 빌드
name: final-app
on:
  push:
    paths:
      - "포트홀_프로젝트_전체/01_앱_최종/소스코드/**"
      - ".github/workflows/final-app.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "포트홀_프로젝트_전체/01_앱_최종/소스코드"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - name: GPS·충격 위치·기존 네이티브 정책 테스트
        run: |
          mkdir -p "$RUNNER_TEMP/pothole-policy-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/pothole-policy-tests" android/app/src/main/java/com/gimmegimme/pothole/*Policy.java tests/blackbox/*Test.java
          for test in BlackboxHttpPolicyTest GpsUploadPolicyTest ImpactLocationPolicyTest NearbyAlertPolicyTest; do
            java -cp "$RUNNER_TEMP/pothole-policy-tests" "com.gimmegimme.pothole.$test"
          done
      - run: npx cap sync android
      - name: APK 만들기
        working-directory: "포트홀_프로젝트_전체/01_앱_최종/소스코드/android"
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pothole-final-apk
          path: "포트홀_프로젝트_전체/01_앱_최종/소스코드/android/app/build/outputs/apk/debug/app-debug.apk"
